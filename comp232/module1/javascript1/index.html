<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <meta name="description" content="COMP 232 JavaScript exercise: call a function on page load to generate a random background color.">
   <title>JavaScript 1 | Random Background Color</title>
   <link rel="stylesheet" href="/assets/styles.css">

   <script>
      function changeBackgroundColor()
      {
         const redValue = Math.floor(Math.random() * 256);
         const greenValue = Math.floor(Math.random() * 256);
         const blueValue = Math.floor(Math.random() * 256);

         document.body.style.backgroundColor =
            "rgb(" + redValue + ", " + greenValue + ", " + blueValue + ")";
      }
   </script>
</head>

<body class="assignmentShell" onload="changeBackgroundColor()">
   <main class="assignmentCard">
      <p class="eyebrow">COMP 232 · Module 1</p>
      <h1>Random Background Color</h1>

      <p>
         This page calls a JavaScript function from the
         <code>&lt;body&gt;</code> tag's <code>onload</code> event. Refresh the
         page and the function generates a new RGB background color.
      </p>

      <p>
         <a href="/">← Back to Wayne Math Notes</a>
      </p>
   </main>
</body>
</html>
